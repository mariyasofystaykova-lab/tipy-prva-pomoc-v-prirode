name: Generate PDF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Noto fonts (Slovak diacritics)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto fonts-noto-cjk

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Generate PDF
        run: node generate-pdf.js

      - name: Commit PDF back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Tipy_Prva_Pomoc_v_Prirode.pdf
          git diff --cached --quiet || git commit -m "📄 Auto-generate PDF [skip ci]"
          git push
